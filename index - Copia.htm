        :root {
            --text: #13243a;
            --bg: #f3f7fc;
            --line: #d6e4f2;
            --primary: #005f8a;
            --surface: #fff;
            font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 18% -10%, #ffdfac, transparent 45%), var(--bg);
            color: var(--text);

        .box {
            text-align: center;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 1.4rem 1.3rem;
            box-shadow: 0 16px 40px rgba(19, 36, 58, 0.12);
        }

        a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
